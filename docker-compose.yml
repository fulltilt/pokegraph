services:
  db:
    image: ankane/pgvector:latest
    container_name: pokedb
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pokedex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: . # Build from root to access shared folder
      dockerfile: backend/Dockerfile
    container_name: pokemon-backend
    ports:
      - "3457:3457"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/pokedex
    volumes:
      - .:/app # Mount entire project
      - /app/node_modules # Prevent overwriting node_modules
    # working_dir: /app
    # command: ["bun", "dist/backend/src/index.js"] # Adjust if using ts-node or another start command
    working_dir: /app/backend
    command: ["bun", "run", "dev"]

  mcp:
    build:
      context: . # Build from root to access shared folder
      dockerfile: mcp/Dockerfile
    container_name: pokemon-mcp
    ports:
      - "3458:3458" # Different port for MCP
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/pokedex
    volumes:
      - .:/app # Mount entire project
    working_dir: /app
    command: ["bun", "dist/mcp/src/server.js"]

  frontend:
    build:
      context: . # Build from root if frontend needs shared resources
      dockerfile: frontend/Dockerfile
    container_name: pokemon-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - ./shared:/app/shared # Mount shared folder if frontend needs it
    working_dir: /app/frontend
    command: ["bun", "run", "dev"]

volumes:
  pgdata:
