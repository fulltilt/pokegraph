services:
  db:
    image: ankane/pgvector:latest
    container_name: pokedb
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pokedex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: . # Build from root to access shared folder
      dockerfile: backend/Dockerfile
    container_name: pokemon-backend
    ports:
      - "3457:3457"
    depends_on:
      - db
      - embedding-service
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/pokedex
      EMBEDDING_SERVICE_URL: http://embedding-service:8000 # Use the service name
    volumes:
      - .:/app # Mount entire project
      - /app/node_modules # Prevent overwriting
      # - /app/shared/node_modules    # Prevent overwriting shared node_modules too
      - /app/backend/node_modules # Prevent overwriting backend node_modules
    # working_dir: /app
    # command: ["bun", "dist/backend/src/index.js"] # Adjust if using ts-node or another start command
    working_dir: /app/backend
    # command: ["bun", "run", "dev"]
    command: sh -c "cd /app && bun install && bunx prisma generate --schema=shared/prisma/schema.prisma && cd backend && bun run dev"

  # mcp:
  #   build:
  #     context: . # Build from root to access shared folder
  #     dockerfile: mcp/Dockerfile
  #   container_name: pokemon-mcp
  #   ports:
  #     - "3458:3458" # Different port for MCP
  #   depends_on:
  #     - db
  #   environment:
  #     DATABASE_URL: postgres://postgres:password@db:5432/pokedex
  #   volumes:
  #     - .:/app # Mount entire project
  #   working_dir: /app
  #   command: ["bun", "dist/mcp/src/server.js"]

  frontend:
    build:
      context: . # Build from root if frontend needs shared resources
      dockerfile: frontend/Dockerfile
    container_name: pokemon-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - ./shared:/app/shared # Mount shared folder if frontend needs it
      - /app/frontend/node_modules # Prevent overwriting
    working_dir: /app/frontend
    command: ["bun", "run", "dev"]

  embedding-service:
    build:
      context: ./scripts/python/embedding_service
      dockerfile: Dockerfile
    container_name: pokemon-embedding
    ports:
      - "8000:8000"
    environment:
      - MODEL_CACHE=/models
    volumes:
      - model-cache:/models

volumes:
  pgdata:
  model-cache:
