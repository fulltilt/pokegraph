x-app-base: &app-base
  working_dir: /app
  volumes:
    - ./:/app
    - root_node_modules:/app/node_modules

services:
  deps:
    image: oven/bun:1
    <<: *app-base
    command:
      [
        "sh",
        "-lc",
        "apt-get update && apt-get install -y openssl && rm -rf /var/lib/apt/lists/* && bun install && bunx prisma generate --schema=shared/prisma/schema.prisma && ls -la /app/node_modules/.prisma/client/default.js",
      ]
    volumes:
      - ./:/app
      - root_node_modules:/app/node_modules
      - frontend_node_modules:/app/frontend/node_modules
      - backend_node_modules:/app/backend/node_modules

  db:
    image: ankane/pgvector:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-pokedex}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pokedex}",
        ]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:password@db:5432/pokedex}
    ports:
      - "3457:3457"
    depends_on:
      deps:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      - root_node_modules:/app/node_modules
      - backend_node_modules:/app/backend/node_modules
    command: ["sh", "-lc", "bun run dev"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    depends_on:
      deps:
        condition: service_completed_successfully
    volumes:
      - ./:/app
      - root_node_modules:/app/node_modules
      - frontend_node_modules:/app/frontend/node_modules
    command: ["sh", "-lc", "bun run dev --host 0.0.0.0 --port 5173"]

volumes:
  pgdata:
  root_node_modules:
  frontend_node_modules:
  backend_node_modules:
