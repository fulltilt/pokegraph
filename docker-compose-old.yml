services:
  deps:
    image: oven/bun:1
    container_name: pokegraph-deps
    working_dir: /app
    volumes:
      - ./:/app
      - root_node_modules:/app/node_modules
      - frontend_node_modules:/app/frontend/node_modules
      - backend_node_modules:/app/backend/node_modules
      # - shared_node_modules:/app/shared/node_modules
    command:
      [
        "sh",
        "-lc",
        "apt-get update && apt-get install -y openssl && rm -rf /var/lib/apt/lists/* && bun install && bunx prisma generate --schema=shared/prisma/schema.prisma && ls -la /app/node_modules/.prisma/client/default.js",
      ]

  db:
    image: ankane/pgvector:latest
    container_name: pokedb
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pokedex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # backend:
  #   build:
  #     context: . # Build from root to access shared folder
