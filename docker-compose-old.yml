  #     # - ./backend:/app/backend # uncomment for VPS but comment for local
  #     - ./backend/src:/app/backend/src # Mount only src for hot reload; uncomment for local but comment for VPS
  #     - ./shared/src:/app/shared/src
  #   working_dir: /app/backend # Sets the default directory that commands will execute from. This is important because the command (like bun run dev) will run relative to this path.
  #   command: ["bun", "run", "dev"] # overrides the CMD in Dockerfile

  # frontend:
  #   build:
  #     context: . # Build from root if frontend needs shared resources
  #     dockerfile: frontend/Dockerfile
  #   container_name: pokemon-frontend
  #   ports:
  #     - "5173:5173"
