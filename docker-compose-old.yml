  #   container_name: pokemon-backend
  #   ports:
  #     - "3457:3457"
  #   depends_on:
  #     - db
  #     # - embedding-service
  #     # - sealed-classifier-service
  #   environment:
  #     DATABASE_URL: postgres://postgres:password@db:5432/pokedex
  #     # EMBEDDING_SERVICE_URL: http://embedding-service:8000
