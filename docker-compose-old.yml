  #   working_dir: /app/frontend
  #   command: ["bun", "run", "dev"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pokemon-backend
    ports:
      - "3457:3457"
    depends_on:
      deps:
        condition: service_completed_successfully
      db:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/pokedex
    volumes:
      - ./:/app
      - root_node_modules:/app/node_modules
      - backend_node_modules:/app/backend/node_modules
      # - shared_node_modules:/app/shared/node_modules
    working_dir: /app/backend
    command: ["sh", "-lc", "bun run dev"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: pokemon-frontend
    ports:
      - "5173:5173"
    depends_on:
      deps:
        condition: service_completed_successfully
    volumes:
      - ./:/app
      - root_node_modules:/app/node_modules
      - frontend_node_modules:/app/frontend/node_modules
      # - shared_node_modules:/app/shared/node_modules
    working_dir: /app/frontend
    command: ["sh", "-lc", "bun run dev --host 0.0.0.0 --port 5173"]

