apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: pokemon-app
spec:
  selector:
    app: backend
  ports:
  - port: 3457
    targetPort: 3457
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: pokemon-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: backend
        image: ghcr.io/fulltilt/pokemon-backend:latest  # Update this
        ports:
        - containerPort: 3457
        envFrom:
        - secretRef:
            name: backend-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
