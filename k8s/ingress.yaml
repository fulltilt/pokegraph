apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pokemon-ingress
  namespace: pokemon-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: traefik  # K3s uses Traefik by default
  rules:
  - host: poke-trades.com  # Update this
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 3457
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 5173
