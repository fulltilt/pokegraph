apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path # K3s default storage class
  hostPath:
    path: /mnt/data/postgres # Create this directory on your nodes
    type: DirectoryOrCreate
