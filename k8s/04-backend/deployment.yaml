apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: pokemon-app
spec:
  replicas: 2 # Multiple replicas for HA
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/fulltilt/pokemon-backend:latest
          ports:
            - containerPort: 3457
          envFrom:
            - configMapRef:
                name: backend-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3457
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3457
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: pokemon-app
spec:
  selector:
    app: backend
  ports:
    - port: 3457
      targetPort: 3457
      name: http
  type: ClusterIP
