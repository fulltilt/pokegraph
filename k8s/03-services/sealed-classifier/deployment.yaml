apiVersion: apps/v1
kind: Deployment
metadata:
  name: sealed-classifier-service
  namespace: pokemon-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sealed-classifier
  template:
    metadata:
      labels:
        app: sealed-classifier
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: sealed-classifier
          image: ghcr.io/fulltilt/pokemon-sealed-classifier:latest
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_NAME
              value: "/app/model"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sealed-classifier-service
  namespace: pokemon-app
spec:
  selector:
    app: sealed-classifier
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
