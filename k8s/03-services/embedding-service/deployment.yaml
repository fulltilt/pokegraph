apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-service
  namespace: pokemon-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embedding-service
  template:
    metadata:
      labels:
        app: embedding-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: embedding-service
          image: ghcr.io/fulltilt/pokemon-embedding-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_CACHE
              value: "/models"
          volumeMounts:
            - name: model-cache
              mountPath: /models
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: embedding-service
  namespace: pokemon-app
spec:
  selector:
    app: embedding-service
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
