apiVersion: batch/v1
kind: CronJob
metadata:
  name: pokemon-scraper
  namespace: pokemon-app
spec:
  schedule: "0 12 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
          - name: ghcr-secret
          containers:
          - name: scraper
            image: ghcr.io/fulltilt/pokemon-scraper:latest
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL